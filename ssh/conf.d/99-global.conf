Host *	
	IdentityFile ~/.config/ssh/keys.d/global/id_rsa
	IdentityFile ~/.config/ssh/keys.d/global/id_ecdsa
	IdentityFile ~/.config/ssh/keys.d/global/id_ed25519
	UserKnownHostsFile ~/.config/ssh/hosts.d/%k
